watch_stylesheet: true
watch_config: true
debug: false
komorebi:
  start_command: "komorebic start --whkd"
  stop_command: "komorebic stop --whkd"
  reload_command: "komorebic stop --whkd && komorebic start --whkd"
bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: false
    blur_effect:
      enabled: false
      acrylic: true
      dark_mode: true
      round_corners: true
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 28
    padding:
      top: 4
      left: 4
      bottom: 0
      right: 4
    widgets:
      left: ["home", "wallpapers", "media", "active_window"]
      center: ["taskbar", "komorebi_workspaces", "komorebi_active_layout"]
      right:
        ["systray", "weather", "microphone", "volume", "clock", "power_menu"]
widgets:
  home:
    type: "yasb.home.HomeWidget"
    options:
      label: "<span>\ue8e5</span>"
      menu_list:
        - { title: "Home", path: "~" }
        - { title: "Downloads", path: "C:\\Users\\%USERPROFILE%\\Downloads" }
        - { title: "User", path: "C:\\Users\\%USERPROFILE%" }
        - { title: "Tools", path: "D:\\Tools" }
        - { title: "Game", path: "D:\\Games" }
        - { title: "Installer", path: "D:\\Installer" }
        - { title: "Wallpaper", path: "D:\\Wallpaper" }
      system_menu: true
      power_menu: false
      blur: true
      round_corners: true
      round_corners_type: "normal"
      border_color: ""
      distance: 5
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0
      alignment: "left"
      direction: "down"
      menu_labels:
        shutdown: "Shutdown"
        restart: "Restart"
        logout: "Logout"
        lock: "Lock"
        sleep: "Sleep"
        system: "System Settings"
        about: "About This PC"
        task_manager: "Task Manager"
  language:
    type: "yasb.language.LanguageWidget"
    options:
      label: "<span>\uf11c</span>{lang[country_code]}"
      update_interval: 5
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]}-{win[class_name]}"
      label_no_window: "\udb82\udda5 I use \ue62a, btw! \udb83\udec0"
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: "..."
      monitor_exclusive: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>\udb83\ude17</span>{%a,%d/%m/%y | \uf017 %H:%M}"
      label_alt: "<span>\udb83\ude17</span>{%A, %d/%m/%Y | \uf017 %H:%M}"
      timezones: []
      locale: "vi_VN"
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 8
        offset_left: 0
        show_holidays: false
        show_week_numbers: true
        country_code: "VN"
        holiday_color: "#FF6464"
        extended: false
      callbacks:
        on_left: "toggle_label"
        on_middle: "next_timezone"
        on_right: "toggle_calendar"
  windows-desktops:
    type: "yasb.windows_desktops.WorkspaceWidget"
    options:
      label_workspace_btn: ""
      label_workspace_active_btn: ""
      animation: true
  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "<span>{icon}</span> {location}: \udb85\udfbc {min_temp}, \udb85\udfb0 {max_temp}, \ue373 {humidity}"
      api_key: "YOUR_API_KEY_HERE"  # Thay mã của bạn vào trong dấu ngoặc
      tooltip: true
      update_interval: 3600 #Update interval in seconds, Min 600
      hide_decimal: true
      location: "Hanoi"
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_card"
        on_middle: "toggle_label"
      icons:
        sunnyDay: "\udb81\udd99"
        clearNight: "\udb81\udd99"
        cloudyDay: "\udb81\udd99"
        cloudyNight: "\udb81\udd99"
        rainyDay: "\udb81\udd99"
        rainyNight: "\udb81\udd99"
        blizzardDay: "\udb81\udd99"
        default: "\udb81\udd99"
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        icon_size: 64
        show_hourly_forecast: true # Set to False to disable hourly forecast
        time_format: "24h" # can be 12h or 24h
        hourly_point_spacing: 76
        hourly_icon_size: 32 # better to set 16, 32 or 64 for better quality
        icon_smoothing: true # should be true for smoother icon or false for sharper icon if using 16, 32 or 64 for hourly_icon_size
        temp_line_width: 3 # can be 0 to hide the temperature line
        current_line_color: "#9ecfd7"
        current_line_width: 1 # can be 0 to hide the current hour line
        current_line_style: "dot"
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "<span>{icon}</span>"
      mute_text: "mute"
      volume_icons:
        - "\ueee8" # Icon for muted
        - "\uf026" # Icon for 0-10% volume
        - "\uf027" # Icon for 11-30% volume
        - "\uf027" # Icon for 31-60% volume
        - "\uf028" # Icon for 61-100% volume
      callbacks:
        on_left: "toggle_mute"
        on_middle: "toggle_label"
        on_right: "toggle_volume_menu"
  microphone:
    type: "yasb.microphone.MicrophoneWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "<span>{icon}</span>"
      mute_text: "mute"
      icons:
        normal: "\uf130"
        muted: "\uf131"
      mic_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
      callbacks:
        on_left: "toggle_mute"
        on_middle: "toggle_label"
        on_right: "toggle_mic_menu"
      label_shadow:
        enabled: false
        color: "black"
        radius: 3
        offset: [1, 1]
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<span>\uf011</span>"
      uptime: true
      blur: true
      blur_background: false
      animation_duration: 200 # Milisecond
      button_row: 5 # Number of buttons in row, min 1 max 5
      buttons:
        sleep: ["\udb81\udcb2", "Ngủ"]
        signout: ["\udb81\uddfd", "Đăng xuất"]
        restart: ["\uead2", "Khởi động lại"]
        shutdown: ["\uf011", "Tắt máy"]
        cancel: ["\ueb8f", "Huỷ bỏ"]
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      animation:
        enabled: true
      icon_size: 18
      ignore_apps:
        processes: []
        titles: []
        classes: []
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0
      tooltip: false
      callbacks:
        on_left: "toggle_window"
        on_middle: "do_nothing"
        on_right: "context_menu"
      preview:
        enabled: true
        width: 240
        delay: 400
        padding: 8
        margin: 8
  win_button:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\ue8e5</span>"
      label_alt: "<span>\udb80\udf5c</span>"
      class_name: "win-btn"
      callbacks:
        on_left: "exec start_menu"
  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span>\udb82\udcfa</span> \uea9a{download_speed} \ueaa1{upload_speed}"
      label_alt: "<span>\udb82\udcfa</span> Download {download_speed} | Upload {upload_speed}"
      update_interval: 1000
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd /c Taskmgr"
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span class=\"icon\">\uf03e</span>"
      image_path: "D:\\Wallpaper\\Full HD picture"
      tooltip: true
      change_automatically: true
      update_interval: 21600
      gallery:
        enabled: true
        blur: true
        image_width: 220
        image_per_page: 8
        gallery_columns: 0
        horizontal_position: center
        vertical_position: bottom
        respect_work_area: true
        show_buttons: false
        orientation: "portrait"
        image_spacing: 7
        lazy_load: true
        lazy_load_delay: 80
        lazy_load_fadein: 200
        image_corner_radius: 5
        enable_cache: true
      keybindings:
        - keys: "win+y"
          action: "toggle_gallery"
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
      run_after:
        - 'powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Milliseconds 100; $ws = New-Object -ComObject WScript.Shell; $ws.SendKeys(''{ESC}'')"'
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}"
      label_alt: "{title} - {artist}"
      max_field_size:
        label: 16
        label_alt: 32
      show_thumbnail: true
      controls_only: false
      controls_left: true
      hide_empty: false
      thumbnail_alpha: 255
      thumbnail_padding: 10
      thumbnail_corner_radius: 20
      symmetric_corner_radius: true
      thumbnail_edge_fade: true
      icons:
        prev_track: "\uf048"
        next_track: "\uf051"
        play: "\uf04b"
        pause: "\uf04c"
      label_shadow:
        enabled: false
        color: "black"
        radius: 6
        offset: [1, 1]
      container_shadow:
        enabled: false
        color: "black"
        radius: 6
        offset: [1, 1]
      media_menu:
        blur: true # Whether to apply a blur effect to the popup background.# The background color of the popup. Can be a HEX, None or "system".        round_corners: true # Whether to round the corners of the popup.
        round_corners_type: "normal" # The type of corner rounding. Can be "normal" or "symmetric".
        border_color: "#94e2d5" # The border color of the popup. Can be a HEX, None or "system".
        alignment: "center" # The alignment of the popup relative to the widget. Can be "left", "center", or "right".
        direction: "down" # The direction in which the popup opens. Can be "up" or "down".
        offset_top: 20 # The vertical offset of the popup from the widget.
        offset_left: 0 # The horizontal offset of the popup from the widget.
        thumbnail_corner_radius: 8 # The corner radius for the thumbnail in the popup.
        thumbnail_size: 120 # The size of the thumbnail in the popup.
        max_title_size: 60 # The maximum size for the title in the popup.
        max_artist_size: 20 # The maximum size for the artist name in the popup.
        show_source: false # Whether to show the media source (e.g., Spotify, YouTube) in the popup.
        show_volume_slider: true
      media_menu_icons:
        play: "\uf144" # Icon for the play button in the popup.
        pause: "\uf28b" # Icon for the pause button in the popup.
        prev_track: "\uf048" # Icon for the previous track button in the popup.
        next_track: "\uf051" # Icon for the next track button in the popup.
        mute: "\uf028" # Icon for the mute button in the popup.
        unmute: "\ueee8" # Icon for the unmute button in the popup.
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_media_menu"
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "◀"
      label_expanded: "▶"
      label_position: "left" # Can be "left" or "right"
      icon_size: 16 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_volume: false
      show_network: true
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_workspace_btn: ""
      label_workspace_active_btn: ""
      label_workspace_populated_btn: ""
      label_default_name: "{index}"
      label_zero_index: false
      enable_scroll_switching: true
      reverse_scroll_direction: false
      hide_empty_workspaces: false
      hide_if_offline: false
      animation: true
      toggle_workspace_layer:
        enabled: false
        tiling_label: "Tiling"
        floating_label: "Floating"
      app_icons:
        enabled_populated: false
        enabled_active: false
        size: 18
        max_icons: 0
        hide_label: true
        hide_duplicates: true
        hide_floating: false
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{icon} {layout_name}"
      layouts:
        [
          "bsp",
          "columns",
          "rows",
          "grid",
          "scrolling",
          "vertical_stack",
          "horizontal_stack",
          "ultrawide_vertical_stack",
          "right_main_vertical_stack",
        ]
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: "toggle_layout_menu"
        on_middle: "toggle_float"
        on_right: "next_layout"
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 8
        offset_left: 0
        show_layout_icons: true
      label_shadow:
        enabled: true
        color: "black"
        radius: 3
        offset: [1, 1]
